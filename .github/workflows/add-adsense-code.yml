name: Add AdSense Code
on:
  push:
    paths:
      - '.github/workflows/add-adsense-code.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert AdSense verification code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          code='''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1155599716593232" crossorigin="anonymous"></script>'''
          if 'ca-pub-1155599716593232' not in s:
              s=s.replace('<head>', '<head>\n'+code, 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Google AdSense verification code'
          git push
