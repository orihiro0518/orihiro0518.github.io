name: Sync AdSense publisher

on:
  push:
    paths:
      - '.github/workflows/sync-adsense-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize AdSense loader on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          new = "ca-pub-" + "1712701486247077"
          old = "ca-pub-" + "1155599716593232"
          loader = f'<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={new}" crossorigin="anonymous"></script>'
          pat = re.compile(r'<script\b[^>]*src=["\']https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-\d+["\'][^>]*>\s*</script>\s*', re.I)
          changed=[]
          for p in Path('.').rglob('*.html'):
              if not p.is_file() or '.git' in p.parts: continue
              text=p.read_text(encoding='utf-8')
              if not re.search(r'<head\b[^>]*>', text, re.I): continue
              cleaned=pat.sub('', text).replace(old,new)
              cleaned=re.sub(r'(<head\b[^>]*>)', r'\1\n'+loader+'\n', cleaned, count=1, flags=re.I)
              if cleaned!=text:
                  p.write_text(cleaned,encoding='utf-8'); changed.append(str(p))
          bad=[]
          for p in Path('.').rglob('*.html'):
              if not p.is_file() or '.git' in p.parts: continue
              text=p.read_text(encoding='utf-8')
              if re.search(r'<head\b[^>]*>', text, re.I):
                  if old in text or text.count('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js') != 1 or new not in text:
                      bad.append(str(p))
          print('normalized HTML files:',len(changed))
          if bad: raise SystemExit('AdSense normalization failed: '+', '.join(bad))
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Restore AdSense publisher ID"
          git push
