name: Apply visual SEO assets

on:
  push:
    paths:
      - '.github/workflows/apply-visual-seo.yml'
      - 'tools/seo_brand_assets.py'
      - 'tools/apply_visual_seo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependency
        run: python -m pip install pillow
      - name: Generate favicon and OG images
        run: python tools/seo_brand_assets.py
      - name: Add favicon and OG metadata
        run: python tools/apply_visual_seo.py --site root --og https://orivector.jp/assets/og-orivector.png
      - name: Commit generated assets and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets index.html about/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Add ORIVECTOR favicon and OG image metadata'
            git push
          fi
