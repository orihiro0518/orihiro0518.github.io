name: Add TOEIC Top Card
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-toeic-top-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add TOEIC navigation card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '/toeic-study/' in s:
              print('TOEIC card already present')
              raise SystemExit(0)
          anchor='<div class="cards">'
          if s.count(anchor)!=1:
              raise SystemExit('Safety stop: cards anchor mismatch')
          card='''\n        <a class="card toeic-live" href="/toeic-study/">\n          <div class="icon">📚 <span class="badge toeic-badge">TOEIC</span></div>\n          <h3>TOEIC対策</h3><span style="font-size:11px;color:#4ade80;font-weight:800">● NEW / 公開中</span>\n          <p>頻出単語・熟語・文法問題と文法解説。間違い復習と学習進捗保存にも対応。</p>\n          <span class="link">TOEIC対策を始める →</span>\n        </a>\n'''
          s=s.replace(anchor,anchor+card,1)
          css='.nespe-badge{background:#18865d}'
          if css not in s:
              raise SystemExit('Safety stop: CSS anchor missing')
          s=s.replace(css,css+'\n    .toeic-live{border-color:rgba(34,197,94,.32)}\n    .toeic-live:hover{border-color:rgba(34,197,94,.72);box-shadow:0 18px 48px rgba(34,197,94,.08)}\n    .toeic-live .link{color:#4ade80}\n    .toeic-badge{background:#168a45}',1)
          s=s.replace('<a href="/network-specialist-study/">ネスペ</a>','<a href="/network-specialist-study/">ネスペ</a>\n      <a href="/toeic-study/">TOEIC</a>',1)
          s=s.replace('<span>🧠 ネスペ 午後対策 <b>100題</b></span>','<span>🧠 ネスペ 午後対策 <b>100題</b></span>\n          <span>📚 TOEIC <b>単語・熟語・文法</b></span>',1)
          s=s.replace('<a href="/network-specialist-study/">ネスペ</a><a href="#roadmap">','<a href="/network-specialist-study/">ネスペ</a><a href="/toeic-study/">TOEIC</a><a href="#roadmap">',1)
          s=s.replace('<a href="/network-specialist-study/">ネスペ対策</a>','<a href="/network-specialist-study/">ネスペ対策</a>\n        <a href="/toeic-study/">TOEIC対策</a>',1)
          if '/aws-study/' not in s or '/network-specialist-study/' not in s or '/toeic-study/' not in s:
              raise SystemExit('Safety stop: navigation guards failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add TOEIC study to ORIVECTOR top"
          git push
