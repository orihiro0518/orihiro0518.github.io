name: Add TOEIC Top Card
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-toeic-top-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote TOEIC across homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<p>AWS Cloud Practitioner（クラウドプラクティショナー）・ネットワークスペシャリストなどの人気資格に対応した、無料問題集とわかりやすい解説で合格をサポートします。</p>'
          new='<p>AWS Cloud Practitioner（クラウドプラクティショナー）・ネットワークスペシャリスト・TOEICに対応。無料問題集とわかりやすい解説で、資格試験と英語学習を効率よく進められます。</p>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Safety stop: hero copy anchor missing')

          news='''        <div class="news">\n          <div class="news-meta"><span>2026.09.03</span><span class="news-tag" style="background:#168a45">TOEIC</span></div>\n          <h3>TOEIC無料問題集・解説記事を正式追加</h3>\n          <p>頻出単語・熟語・文法の4択演習に加え、5文型・時制・助動詞・分詞・関係詞などの解説記事を公開しています。</p>\n        </div>\n'''
          anchor='''        <div class="news">\n          <div class="news-meta"><span>2026.08.30</span><span class="news-tag" style="background:#6049c8">お知らせ</span></div>'''
          if 'TOEIC無料問題集・解説記事を正式追加' not in s:
              if anchor not in s:
                  raise SystemExit('Safety stop: news anchor missing')
              s=s.replace(anchor,news+anchor,1)

          guards=[
              '<title>ORIVECTOR｜AWS・ネスペ・TOEICの無料問題集・資格学習</title>',
              'href="/toeic-study/"',
              'ca-pub-1712701486247077',
              'TOEIC無料問題集・解説記事を正式追加'
          ]
          for g in guards:
              if g not in s:
                  raise SystemExit('Safety stop: missing '+g)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Promote TOEIC on ORIVECTOR homepage"
          git push
