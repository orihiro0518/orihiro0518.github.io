name: Promote TOEIC on homepage

on:
  push:
    paths:
      - '.github/workflows/promote-toeic-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage TOEIC visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hero = '<p>AWS Cloud Practitioner（クラウドプラクティショナー）・ネットワークスペシャリストなどの人気資格に対応した、無料問題集とわかりやすい解説で合格をサポートします。</p>'
          new_hero = '<p>AWS Cloud Practitioner（クラウドプラクティショナー）・ネットワークスペシャリスト・TOEICに対応。無料問題集とわかりやすい解説で、資格試験と英語学習を効率よく進められます。</p>'

          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)
          elif new_hero not in s:
              raise SystemExit('Expected hero copy was not found; refusing broad rewrite')

          toeic_news = '''        <div class="news">
          <div class="news-meta"><span>2026.09.03</span><span class="news-tag" style="background:#168a45">TOEIC</span></div>
          <h3>TOEIC無料問題集・解説記事を正式追加</h3>
          <p>頻出単語・熟語・文法の4択演習に加え、5文型・時制・助動詞・分詞・関係詞などの解説記事を公開しています。</p>
        </div>
'''
          anchor = '''        <div class="news">
          <div class="news-meta"><span>2026.08.30</span><span class="news-tag" style="background:#6049c8">お知らせ</span></div>'''
          if 'TOEIC無料問題集・解説記事を正式追加' not in s:
              if anchor not in s:
                  raise SystemExit('News insertion anchor not found')
              s = s.replace(anchor, toeic_news + anchor, 1)

          checks = [
              '<title>ORIVECTOR｜AWS・ネスペ・TOEICの無料問題集・資格学習</title>',
              'href="/toeic-study/"',
              'AWS Cloud Practitioner（クラウドプラクティショナー）・ネットワークスペシャリスト・TOEICに対応',
              'TOEIC無料問題集・解説記事を正式追加',
              'ca-pub-1712701486247077',
          ]
          for marker in checks:
              if marker not in s:
                  raise SystemExit('Missing expected marker: ' + marker)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Promote TOEIC on ORIVECTOR homepage"
          git push
