name: Add operator profile links

on:
  push:
    paths:
      - '.github/workflows/add-operator-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site top safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
            ('<a href="#about">運営者情報</a>', '<a href="/about/">運営者情報</a>'),
            ('<h4>運営者情報</h4>\n        <p>ORIVECTOR（オリベクター）</p>\n        <p>IT資格学習サイト運営</p>', '<h4>運営者情報</h4>\n        <a href="/about/">運営者 shun のプロフィール</a>\n        <p>SIer勤務・インフラエンジニア</p>')
          ]
          changed = False
          for old, new in replacements:
            if old in s:
              if s.count(old) != 1:
                raise SystemExit(f'Unexpected duplicate target: {old}')
              s = s.replace(old, new)
              changed = True
            elif new not in s:
              raise SystemExit(f'Target not found: {old}')
          if changed:
            p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link operator profile from site top"
          git push